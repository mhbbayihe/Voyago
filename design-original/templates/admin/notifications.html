<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
  <div class="bo">
    <nav th:replace="~{fragments/layout :: adminNav('notifications')}"></nav>
    <section>
      <div class="page-head"><div><h1>Notifications envoyées</h1><p class="muted">100 derniers e-mails et SMS (mode démonstration : non envoyés réellement).</p></div></div>
      <div class="card">
        <div class="table-wrap">
          <table class="table stack-mobile">
            <thead><tr><th>Date</th><th>Canal</th><th>Destinataire</th><th>Objet</th><th>Statut</th></tr></thead>
            <tbody>
              <tr th:each="n : ${notifications}">
                <td data-label="Date" class="nowrap" th:text="${#temporals.format(n.createdAt, 'dd/MM HH:mm')}">date</td>
                <td data-label="Canal" th:text="${n.channel.label}">canal</td>
                <td data-label="Destinataire" th:text="${n.recipient}">dest</td>
                <td data-label="Objet" th:text="${n.subject != null ? n.subject : #strings.abbreviate(n.body, 60)}">objet</td>
                <td data-label="Statut"><span class="badge" th:classappend="${n.status.name() == 'FAILED'} ? 'danger' : 'success'" th:text="${n.status}">statut</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
