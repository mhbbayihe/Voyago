<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Journal d’audit')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
  <div class="bo">
    <nav th:replace="~{fragments/layout :: adminNav('audit')}"></nav>
    <section>
      <div class="page-head"><div><h1>Journal d'audit</h1><p class="muted">Actions sensibles : annulations, remboursements, modifications de tarif, contrôles de billets, comptes (RG9).</p></div></div>
      <div class="card">
        <div class="table-wrap">
          <table class="table stack-mobile">
            <thead><tr><th>Date</th><th>Acteur</th><th>Action</th><th>Détails</th></tr></thead>
            <tbody>
              <tr th:each="l : ${logs}">
                <td data-label="Date" class="nowrap" th:text="${#temporals.format(l.createdAt, 'dd/MM/yyyy HH:mm:ss')}">date</td>
                <td data-label="Acteur" th:text="${l.actor}">acteur</td>
                <td data-label="Action"><span class="badge info" th:text="${l.action}">action</span></td>
                <td data-label="Détails" class="small" th:text="${l.details}">détails</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
