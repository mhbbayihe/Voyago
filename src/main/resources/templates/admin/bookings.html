<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Réservations')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
  <div class="bo">
    <nav th:replace="~{fragments/layout :: adminNav('bookings')}"></nav>
    <section>
      <div class="page-head"><div><h1>Réservations</h1><p class="muted" th:text="${#lists.size(bookings) + ' réservation(s)'}">n</p></div></div>
      <div class="card">
        <div class="table-wrap">
          <table class="table stack-mobile">
            <thead><tr><th>Référence</th><th>Client</th><th>Voyage</th><th>Compagnie</th><th>Montant</th><th>Remb.</th><th>Statut</th></tr></thead>
            <tbody>
              <tr th:each="b : ${bookings}">
                <td data-label="Référence"><a class="mono" th:href="@{/bookings/{id}(id=${b.id})}" th:text="${b.reference}">ref</a></td>
                <td data-label="Client" th:text="${b.customerName}">client</td>
                <td data-label="Voyage"><svg th:replace="~{fragments/layout :: icon(${b.mode.icon})}"></svg> <th:block th:text="${b.tripLabel + ' · ' + #temporals.format(b.departureAt, 'dd/MM HH:mm')}">voyage</th:block></td>
                <td data-label="Compagnie" th:text="${b.companyName}">compagnie</td>
                <td data-label="Montant" th:text="${@fmt.money(b.totalAmount)}">0</td>
                <td data-label="Remboursé" th:text="${b.refundAmount > 0 ? @fmt.money(b.refundAmount) : '-'}">0</td>
                <td data-label="Statut"><span class="badge" th:classappend="${b.status.tone}" th:text="${b.status.label}">statut</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
