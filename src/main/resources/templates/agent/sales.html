<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ventes')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
  <div class="bo">
    <nav th:replace="~{fragments/layout :: agentNav('sales')}"></nav>
    <section>
      <div class="page-head"><div><h1>Ventes</h1><p class="muted">Toutes les réservations de votre compagnie (en ligne et au guichet).</p></div></div>
      <div class="card">
        <div class="table-wrap">
          <table class="table stack-mobile">
            <thead><tr><th>Référence</th><th>Client</th><th>Voyage</th><th>Places</th><th>Montant</th><th>Canal</th><th>Statut</th></tr></thead>
            <tbody>
              <tr th:each="b : ${bookings}">
                <td data-label="Référence"><a class="mono" th:href="@{/bookings/{id}(id=${b.id})}" th:text="${b.reference}">ref</a></td>
                <td data-label="Client" th:text="${b.customerName}">client</td>
                <td data-label="Voyage" th:text="${b.tripLabel + ' · ' + #temporals.format(b.departureAt, 'dd/MM HH:mm')}">voyage</td>
                <td data-label="Places" th:text="${b.seatsLabel}">1</td>
                <td data-label="Montant" th:text="${@fmt.money(b.totalAmount)}">0</td>
                <td data-label="Canal" th:text="${b.soldByAgentId != null} ? 'Guichet' : 'En ligne'">canal</td>
                <td data-label="Statut"><span class="badge" th:classappend="${b.status.tone}" th:text="${b.status.label}">statut</span></td>
              </tr>
              <tr th:if="${#lists.isEmpty(bookings)}"><td colspan="7" class="muted">Aucune vente.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
